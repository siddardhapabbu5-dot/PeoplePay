services:
  db:
    image: postgres:16-alpine
    container_name: peoplepay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplepay
      POSTGRES_PASSWORD: peoplepay
      POSTGRES_DB: peoplepay
    ports:
      - "5434:5432"
    volumes:
      - peoplepay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepay -d peoplepay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peoplepay_pg:
